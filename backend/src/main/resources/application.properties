# ============================================
# Server Configuration
# ============================================
server.port=${PORT:8080}

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_analyzer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sushil@1902}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${UPLOAD_DIR:uploads/resumes}

# ============================================
# JWT Configuration
# ============================================
jwt.secret=${JWT_SECRET:resumeAnalyzerSuperSecretKey2024ForJWTTokenGenerationMinimum256Bits}
jwt.expiration=86400000

# ============================================
# Gemini AI API Configuration
# ============================================
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ============================================
# CORS Configuration
# ============================================
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# ============================================
# Logging
# ============================================
logging.level.com.resumeanalyzer=INFO
logging.level.org.springframework.security=INFO
