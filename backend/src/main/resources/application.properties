# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# MySQL Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads/resumes

# ============================================
# JWT Configuration
# ============================================
jwt.secret=resumeAnalyzerSuperSecretKey2024ForJWTTokenGenerationMinimum256Bits
jwt.expiration=86400000

# ============================================
# Gemini AI API Configuration
# Get your free key at: https://aistudio.google.com/app/apikey
# ============================================
gemini.api.key=YOUR_GEMINI_API_KEY_HERE
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# ============================================
# CORS Configuration
# ============================================
cors.allowed.origins=http://localhost:3000

# ============================================
# Logging
# ============================================
logging.level.com.resumeanalyzer=DEBUG
logging.level.org.springframework.security=INFO
