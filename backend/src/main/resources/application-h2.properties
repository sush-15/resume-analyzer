# ============================================
# H2 In-Memory Database Profile
# Use this to run WITHOUT MySQL installed
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================

# H2 datasource
spring.datasource.url=jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Override MySQL dialect from main properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
